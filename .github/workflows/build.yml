name: Compilation et test

on:
  push:
    branches-ignore: [ci-logs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilation du mod
        id: build
        run: |
          mkdir -p ci-out
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee ci-out/compilation.log

      - name: Serveur Minecraft 26.3 de test
        id: serveur
        if: steps.build.outcome == 'success'
        run: bash ci/test-server.sh

      - name: Envoi des journaux sur la branche ci-logs
        if: always()
        env:
          JETON: ${{ github.token }}
        run: |
          mkdir -p ci-out
          {
            echo "branche: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "execution: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "compilation: ${{ steps.build.outcome }}"
            echo "serveur: ${{ steps.serveur.outcome }}"
            date -u
          } > ci-out/statut.txt
          cp build/libs/royaumes-*.jar ci-out/ 2>/dev/null || true
          cd ci-out
          git init -q
          git checkout -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Journaux ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${JETON}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Publication du .jar (version de développement)
        if: steps.build.outcome == 'success' && steps.serveur.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev -y --cleanup-tag || true
          gh release create dev build/libs/royaumes-*.jar --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Royaumes Mortels — version de développement" \
            --notes "Compilé automatiquement depuis ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Nécessite NeoForge 26.3."
